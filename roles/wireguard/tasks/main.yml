---
# tasks file for wireguard
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install WireGuard and required packages
  apt:
    name:
      - wireguard
      - wireguard-tools
      - qrencode
    state: present

- name: Enable IP forwarding (server only)
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes
  when: wg_role == 'server'

- name: Create WireGuard configuration directory
  file:
    path: /etc/wireguard
    state: directory
    mode: '0700'

- name: Check if private key already exists
  stat:
    path: /etc/wireguard/privatekey
  register: private_key_file

- name: Generate private key for WireGuard
  shell: wg genkey
  register: wg_private_key
  when: not private_key_file.stat.exists
  changed_when: false

- name: Generate public key for WireGuard
  shell: echo "{{ wg_private_key.stdout }}" | wg pubkey
  register: wg_public_key
  when: not private_key_file.stat.exists
  changed_when: false

- name: Save private key
  copy:
    content: "{{ wg_private_key.stdout }}"
    dest: /etc/wireguard/privatekey
    mode: '0600'
  when: not private_key_file.stat.exists
  notify: restart wireguard

- name: Save public key
  copy:
    content: "{{ wg_public_key.stdout }}"
    dest: /etc/wireguard/publickey
    mode: '0644'
  when: not private_key_file.stat.exists

- name: Read existing private key
  slurp:
    src: /etc/wireguard/privatekey
  register: existing_private_key
  when: private_key_file.stat.exists

- name: Read existing public key
  slurp:
    src: /etc/wireguard/publickey
  register: existing_public_key
  when: private_key_file.stat.exists

- name: Set fact for private key
  set_fact:
    wg_private_key_content: "{{ existing_private_key.content | b64decode }}"
  when: private_key_file.stat.exists

- name: Set fact for public key
  set_fact:
    wg_public_key_content: "{{ existing_public_key.content | b64decode }}"
  when: private_key_file.stat.exists

- name: Display public key for manual configuration
  debug:
    msg: "{{ ansible_hostname }} public key: {{ wg_public_key_content | default(wg_public_key.stdout) }}"

- name: Deploy WireGuard configuration
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: '0600'
  notify: restart wireguard

- name: Determine if peers are configured
  set_fact:
    peers_configured: >-
      {{
        (wg_role == 'server' and wg_peers | selectattr('public_key', 'ne', '') | list | length > 0)
        or
        (wg_role == 'client' and wg_server_peer.public_key != '')
      }}

- name: Start and enable WireGuard service
  systemd:
    name: wg-quick@wg0
    enabled: yes
    state: started
  when: peers_configured
